[project]
name = "my-django-project"
version = "0.1.0"
description = "AI-native Django REST API"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "dj-database-url>=2.3",
    "django>=5.1",
    "django-cors-headers>=4.0",
    "djangorestframework>=3.15",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
pythonpath = ["src"]
